name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.30.1"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75.0
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.local/share/solana/
            target/
          key: ${{ runner.os }}-rust175-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}
          
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        
      - name: Install Anchor
        run: |
          npm i -g @coral-xyz/anchor-cli@${{ env.ANCHOR_VERSION }}
          
      - name: Verify installations
        run: |
          rustc --version
          solana --version
          anchor --version
          
      - name: Build
        run: anchor build
